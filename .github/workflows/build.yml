# 编译与发布（Windows、macOS、Linux）
# - 提交 PR、推送到 main：三个平台都编译、打包，并在 macOS / Linux 上真正启动一次（冒烟测试），安装包作为构建产物上传（保留 14 天）
# - PR 合并进 main（推送到 main）时，如果 Downloader.csproj 的 <Version> 还没有对应的 tag v<版本号>：
#   打 tag 并把全部安装包和 SHA256SUMS 发布到同名 GitHub Release。所以要发新版本，就在 PR 里改 <Version>；
#   版本号没变的 PR 合并后只编译，不发布（PR 的检查里会提示）
# - 手动推送 tag v<版本号>（与 <Version> 一致）同样会发布
#   （Release 不存在时自动创建；已手动创建并写好发布说明时只上传 / 覆盖安装包，不改说明）
# - 也可在 Actions 页面手动运行（不发布 Release）
#
# 安装包（文件名中的平台标识与 can-pilot 一致，下载器按它挑本机的安装包，见 ViewModels/Manifest.cs）：
#   CAN-Downloader-<版本>-win-x64.zip          只含 Downloader.exe
#   CAN-Downloader-<版本>-osx-arm64.zip        CAN Downloader.app（仅 Apple Silicon ARM64）
#   CAN-Downloader-<版本>-linux-x64.tar.gz     can-downloader/（Downloader、install.sh、菜单项），任何 glibc 发行版
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # PR：同一 PR 只保留最新一次运行。main 与 tag 的运行可能要发布，每次运行单独一组：
  # 同一组最多只排队一个，共用一组时排队中的发布会被下一次推送替换掉
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # 版本号唯一来源是 Downloader.csproj；推送 tag 时必须与之一致，否则自更新会反复提示新版本
      - name: 读取版本号
        id: version
        run: |
          set -euo pipefail
          version=$(dotnet msbuild src/Downloader/Downloader.csproj -getProperty:Version | tr -d '[:space:]')
          if [ -z "$version" ]; then echo "::error::无法从 Downloader.csproj 读取版本号"; exit 1; fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 Downloader.csproj 的版本号 ${version} 不一致（应为 v${version}）"
            exit 1
          fi
          echo "版本号 ${version}"

      # 是否发布：推送 tag 时发布；推送到 main 时，tag v<版本号> 还不存在才发布（版本号没变就只编译）
      - name: 判断是否发布
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then exists=true; else exists=false; fi
          release=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            release=true
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && [ "$exists" = false ]; then
            release=true
            echo "::notice::${tag} 尚未发布，本次构建完成后发布"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if [ "$exists" = true ]; then
              echo "::notice::Downloader.csproj 的版本号 ${VERSION} 已经发布过（${tag}），合并后不会发布新版本；要发布请在本 PR 里提高 <Version>"
            else
              echo "::notice::合并后会发布 ${tag}"
            fi
          fi
          echo "release=${release}" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 编译
        run: dotnet build CanDownloader.slnx -c Release

      - name: 安装与下载回归测试
        run: dotnet run --project tests/Downloader.RegressionTests -c Release

      - name: 单文件发布
        run: dotnet publish src/Downloader -p:PublishProfile=win-x64

      # 安装包是只含 Downloader.exe 的 zip，自更新从中取出 Downloader.exe
      - name: 打包
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist/CAN-Downloader-${{ needs.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path publish/win-x64/Downloader.exe -DestinationPath $zip -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: CAN-Downloader-win-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 安装与下载回归测试
        run: dotnet run --project tests/Downloader.RegressionTests -c Release

      - name: 发布并打包 linux-x64
        run: bash packaging/build.sh linux-x64

      - name: 启动冒烟测试
        # 解压真正的安装包，在虚拟 X 显示器里启动（--offline：不连 API，停在“无法连接”），30 秒内退出就算启动失败
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq xvfb >/dev/null
          smoke="${RUNNER_TEMP}/smoke"
          mkdir -p "$smoke"
          tar -xzf "dist/CAN-Downloader-${{ needs.version.outputs.version }}-linux-x64.tar.gz" -C "$smoke"
          set +e
          (cd "${smoke}/can-downloader" && xvfb-run -a timeout 30 ./Downloader --offline)
          code=$?
          set -e
          cat "${smoke}"/can-downloader/logs/*.log || true
          if [ "$code" -ne 124 ]; then
            echo "::error::Linux 版启动后 30 秒内就退出了（退出码 ${code}），见上面的日志"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: CAN-Downloader-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  macos:
    # 发布 osx-arm64，打包成 Apple Silicon 专用的 CAN Downloader.app
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: 安装与下载回归测试
        run: dotnet run --project tests/Downloader.RegressionTests -c Release

      - name: 发布并打包 osx-arm64
        run: bash packaging/build.sh osx-arm64

      - name: 验证安装包与安装卸载脚本
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/macos-install-test"
          mkdir -p "$work/package" "$work/Applications"
          ditto -x -k "dist/CAN-Downloader-${{ needs.version.outputs.version }}-osx-arm64.zip" "$work/package"
          test -f "$work/package/install.sh"
          test -f "$work/package/uninstall.sh"
          sh "$work/package/install.sh" "$work/Applications"
          app="$work/Applications/CAN Downloader.app"
          test -x "$app/Contents/MacOS/Downloader"
          codesign --verify --deep --strict "$app"
          sh "$app/Contents/Resources/uninstall.sh"
          test ! -e "$app"

      - name: 启动冒烟测试（Apple Silicon ARM64）
        # 用副本跑，30 秒内退出就算启动失败；日志写在 ~/Library/Application Support/CAN Downloader/logs
        run: |
          set -euo pipefail
          app="${RUNNER_TEMP}/CAN Downloader.app"
          cp -R "dist/CAN Downloader.app" "$app"
          logs="${HOME}/Library/Application Support/CAN Downloader/logs"
          smoke() {
            local label=$1; shift
            "$@" --offline &
            local pid=$!
            sleep 30
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid"; wait "$pid" 2>/dev/null || true
              echo "${label}：30 秒后仍在运行"
            else
              set +e; wait "$pid"; local code=$?; set -e
              cat "$logs"/*.log 2>/dev/null || true
              echo "::error::macOS ${label} 启动后 30 秒内就退出了（退出码 ${code}），见上面的日志"
              exit 1
            fi
          }
          smoke "arm64" "${app}/Contents/MacOS/Downloader"
          cat "$logs"/*.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: CAN-Downloader-osx-arm64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: CAN-Downloader-*
          path: packages
          merge-multiple: true

      # 其他平台的下载器在 API 没有给出本平台安装包时，从同一发布的 SHA256SUMS 查 SHA-256 核对
      - name: 生成 SHA256SUMS
        working-directory: packages
        run: |
          set -euo pipefail
          sha256sum *.zip *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          {
            echo '### 安装包'
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传到 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          files=(packages/*.zip packages/*.tar.gz packages/SHA256SUMS)

          # main 的运行在这里打 tag（tag 已存在时 push 失败，不会改动它）。构建期间别的运行可能已经发布了同一版本，
          # 所以不论是否由本次创建，都重新读取 tag 指向的提交：不是本次构建的提交就停止，不覆盖那个发布的安装包
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/${tag}" || echo "tag ${tag} 已存在（可能由其他运行创建），核对它指向的提交"
          fi
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          tagged=$(git rev-parse "${tag}^{commit}")
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::tag ${tag} 现在指向 ${tagged}，不是本次构建的 ${GITHUB_SHA}，不上传"
              exit 1
            fi
            echo "::warning::${tag} 已在另一个提交 ${tagged} 上发布，本次（${GITHUB_SHA}）不发布；要发布本次的改动请提高 <Version>"
            exit 0
          fi

          # 0.x 是预发布；1.0.0 起为正式版。Latest 不在这里设置，由下一步统一校正
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            if [[ "$VERSION" != 0.* ]]; then gh release edit "$tag" --prerelease=false; fi
          elif [[ "$VERSION" == 0.* ]]; then
            gh release create "$tag" "${files[@]}" --title "CAN 下载器 ${VERSION}" --generate-notes --verify-tag --prerelease
          else
            gh release create "$tag" "${files[@]}" --title "CAN 下载器 ${VERSION}" --generate-notes --verify-tag --latest=false
          fi

  # main 的各次运行并行，旧版本可能更晚发布完，所以 Latest 不在发布时设置，而是发布后把全部正式版里版本最高的标为 Latest。
  # “列出 → 设置”放在所有运行共用的并发组里串行执行，中间不会被别的运行插入；
  # 排队中的校正被更新的运行替换时，替换它的运行做同样的校正、看得到更多 Release，所以不会漏
  latest:
    needs: release
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-latest
      cancel-in-progress: false
    steps:
      - name: 校正最新版
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          top=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName' \
                | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -n1 || true)
          if [ -z "$top" ]; then echo "没有正式版"; exit 0; fi
          gh release edit "$top" --latest
          echo "最新版：${top}"
