# 编译与发布
# - 推送到 main、提交 PR：编译检查，并把单文件 exe 作为构建产物上传（保留 14 天）
# - 推送 tag v<版本号>（与 Downloader.csproj 的 <Version> 一致）：单文件发布，打包 zip 上传到同名 GitHub Release
#   （Release 不存在时自动创建；已手动创建并写好发布说明时只上传 / 覆盖安装包，不改说明）
# - 也可在 Actions 页面手动运行（不发布 Release）
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # 版本号唯一来源是 Downloader.csproj；推送 tag 时必须与之一致，否则自更新会反复提示新版本
      - name: 读取版本号
        id: version
        run: |
          $version = (dotnet msbuild src/Downloader/Downloader.csproj -getProperty:Version).Trim()
          if (-not $version) { throw '无法从 Downloader.csproj 读取版本号' }
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "tag $env:GITHUB_REF_NAME 与 Downloader.csproj 的版本号 $version 不一致（应为 v$version）"
          }
          Write-Host "版本号 $version"

      - name: 编译
        run: dotnet build CanDownloader.slnx -c Release

      - name: 单文件发布
        run: dotnet publish src/Downloader -p:PublishProfile=win-x64

      # 安装包是只含 Downloader.exe 的 zip，自更新从中取出 Downloader.exe
      - name: 打包
        id: package
        run: |
          $zip = "CAN-Downloader-${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path publish/win-x64/Downloader.exe -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $zip).Length
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "### $zip`n`n- 大小：$size 字节`n- SHA-256：``$hash``" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "$zip  $size 字节  SHA-256 $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: CAN-Downloader-${{ steps.version.outputs.version }}-win-x64
          path: publish/win-x64/Downloader.exe
          retention-days: 14

      - name: 上传到 GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.package.outputs.zip }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:ZIP --clobber
            if ($LASTEXITCODE -ne 0) { throw "上传 Release 失败" }
            # 0.x 是预发布；1.0.0 起为正式版，标为正式版与最新版
            if (-not $env:VERSION.StartsWith('0.')) { gh release edit $tag --prerelease=false --latest }
          } elseif ($env:VERSION.StartsWith('0.')) {
            gh release create $tag $env:ZIP --title "CAN 下载器 $env:VERSION" --generate-notes --verify-tag --prerelease
          } else {
            gh release create $tag $env:ZIP --title "CAN 下载器 $env:VERSION" --generate-notes --verify-tag --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "上传 Release 失败" }
